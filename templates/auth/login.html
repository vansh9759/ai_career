{% extends 'layout.html' %}

{% block title %}Sign In | CareerOS AI{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;" class="glass-panel">
    <div style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="brand-icon" style="margin: 0 auto 16px auto;">
                <i class="bi bi-cpu-fill"></i>
            </div>
            <h2>Sign In to <span class="gradient-text">CareerOS AI</span></h2>
            <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">Access your personal AI mentor and employability score.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@university.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-gradient" style="width: 100%; padding: 12px; margin-top: 8px;">
                Sign In <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
