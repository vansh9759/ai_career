{% extends 'layout.html' %}

{% block title %}Create Account | CareerOS AI{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 30px auto;" class="glass-panel">
    <div style="padding: 32px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2>Get Started with <span class="gradient-text">CareerOS AI</span></h2>
            <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">Join the world's first AI Career Operating System ecosystem.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Alex Rivera" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="alex@stanford.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                    <label class="form-label">Account Role</label>
                    <select name="role" class="form-control">
                        <option value="student">Student / Fresh Graduate</option>
                        <option value="recruiter">Recruiter / Employer</option>
                        <option value="university">University Placement Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Dream Company</label>
                    <input type="text" name="dream_company" class="form-control" placeholder="Google, Microsoft, Amazon" value="Google">
                </div>
            </div>

            <button type="submit" class="btn btn-gradient" style="width: 100%; padding: 12px; margin-top: 8px;">
                Create AI Career Account <i class="bi bi-rocket-takeoff-fill"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            Already registered? <a href="{{ url_for('auth.login') }}" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
