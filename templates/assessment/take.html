{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
    <div class="card glass-card border-0 shadow p-4 mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="badge bg-cyan text-dark mb-1">{{ track.category }}</span>
                <h3 class="fw-bold text-white mb-0">{{ track.title }}</h3>
            </div>
            <div class="text-end">
                <span class="badge bg-danger rounded-pill px-3 py-2 fs-6"><i class="bi bi-clock me-1"></i> Proctored Exam</span>
            </div>
        </div>
        <p class="text-muted mb-0">{{ track.description }}</p>
    </div>

    <form method="POST" action="{{ url_for('assessment.take', track_id=track_id) }}">
        {% for q in track.questions %}
        <div class="card glass-card border-0 shadow p-4 mb-4">
            <h5 class="fw-bold text-white mb-3"><span class="text-cyan me-2">Q{{ loop.index }}.</span> {{ q.question }}</h5>
            
            <div class="ps-3">
                {% for opt in q.options %}
                <div class="form-check mb-2">
                    <input class="form-check-input bg-dark border-secondary" type="radio" name="q_{{ loop.parent.loop.index0 }}" id="q{{ loop.parent.loop.index0 }}_opt{{ loop.index0 }}" value="{{ loop.index0 }}" required>
                    <label class="form-check-label text-light" for="q{{ loop.parent.loop.index0 }}_opt{{ loop.index0 }}">
                        {{ opt }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <div class="text-end mb-5">
            <a href="{{ url_for('assessment.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-cyan btn-lg rounded-pill px-5"><i class="bi bi-send-fill me-1"></i> Submit Assessment</button>
        </div>
    </form>
</div>
{% endblock %}
