<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | CareerOS AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background:var(--bg-base); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="width:100%; max-width:440px;" class="glass-panel">
        <div style="padding: 36px;">
            <div style="text-align: center; margin-bottom: 28px;">
                <div class="brand-icon" style="margin: 0 auto 16px auto; background:linear-gradient(135deg, #10b981, #059669); color:#fff; width:52px; height:52px; font-size:24px;">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h2>Admin <span class="gradient-text">Portal Sign In</span></h2>
                <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">Authorized Administrator Access Only.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="glass-card" style="border-left: 4px solid var(--state-danger); padding: 10px 14px; margin-bottom: 16px; font-size:13px; color:var(--text-main);">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('admin.admin_login') }}" method="POST">
                <div class="form-group">
                    <label class="form-label"><i class="bi bi-envelope-fill" style="color:var(--brand-primary);"></i> Admin Email</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@careeros.ai" required>
                </div>

                <div class="form-group">
                    <label class="form-label" style="display:flex; justify-content:space-between;">
                        <span><i class="bi bi-lock-fill" style="color:var(--brand-secondary);"></i> Password</span>
                        <a href="javascript:void(0)" onclick="alert('Contact System Administrator to reset access.')" style="font-size:12px; color:var(--brand-primary);">Forgot Password?</a>
                    </label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:13px; color:var(--text-muted);">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="checkbox" name="remember" checked style="accent-color:var(--brand-secondary);"> Remember Admin Session
                    </label>
                </div>

                <button type="submit" class="btn btn-gradient" style="width: 100%; padding: 14px; font-size:15px; background:linear-gradient(135deg, #10b981, #059669);">
                    Authenticate Administrator <i class="bi bi-shield-check"></i>
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted); border-top:1px solid var(--glass-border); padding-top:16px;">
                Return to <a href="{{ url_for('home') }}" style="color: var(--brand-primary); text-decoration: none; font-weight: 600;">Main Website →</a>
            </div>
        </div>
    </div>
</body>
</html>
